# Self-hosted stack referenced in backend/docs/ARCHITECTURE.md
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zetarix
      POSTGRES_PASSWORD: zetarix
      POSTGRES_DB: zetarix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zetarix"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zetarix
      MINIO_ROOT_PASSWORD: zetarix-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: zetarix
      POSTGRES_PWD: zetarix
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ZETARIX_GROUNDING: few_shot
      ZETARIX_LLM_BACKEND: local
      OLLAMA_MODEL: llama3.1:latest
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_URL: postgresql://zetarix:zetarix@postgres:5432/zetarix
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: zetarix
      MINIO_SECRET_KEY: zetarix-minio-dev
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./docs:/app/docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
  minio_data:
